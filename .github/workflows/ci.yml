name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build & test (zero warnings)
        env:
          RIKKA_TEST_TLS: "1"
        run: |
          make clean
          make cli
          make test 2>&1 | tee /tmp/test.log
          if grep -E 'warning' /tmp/test.log; then echo "WARNINGS PRESENT" && exit 1; fi
          grep -q "ALL SUITES PASSED" /tmp/test.log
      - name: Benchmarks (threshold gate)
        run: make check-bench

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: UBSan + fuzz parsers
        run: make ubsan
      - name: ASan + LSan (leak detection)
        run: |
          make asan
          make lsan
      - name: TSan (SPSC/pipeline)
        run: make tsan

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
      - name: NDK cross-compile librikka.so
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          cmake -S android -B android/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build android/build -j2 2>&1 | tee /tmp/android_build.log
          if grep -E 'warning' /tmp/android_build.log; then echo "WARNINGS PRESENT" && exit 1; fi
          ls -la android/build/librikka.so
      - name: Build APK (Gradle)
        uses: gradle/actions/setup-gradle@v3
      - name: Set up pnpm (web-ui 前端构建依赖)
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: android/web-ui/pnpm-lock.yaml
      - name: Install web-ui dependencies
        working-directory: android/web-ui
        run: pnpm install --frozen-lockfile
      - name: Assemble debug APK
        run: |
          cd android && ./gradlew :app:assembleDebug --no-daemon > /tmp/gradle.log 2>&1 || { echo "GRADLE FAILED"; tail -100 /tmp/gradle.log; exit 1; }
          tail -5 /tmp/gradle.log
          ls -la app/build/outputs/apk/debug/*.apk
