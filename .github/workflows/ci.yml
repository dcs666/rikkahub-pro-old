name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build & test (zero warnings)
        env:
          RIKKA_TEST_TLS: "1"
        run: |
          make clean
          make cli
          make test 2>&1 | tee /tmp/test.log
          if grep -E 'warning' /tmp/test.log; then echo "WARNINGS PRESENT" && exit 1; fi
          grep -q "ALL SUITES PASSED" /tmp/test.log
      - name: Benchmarks (threshold gate)
        run: make check-bench

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: UBSan + fuzz parsers
        run: make ubsan
      - name: ASan + LSan (leak detection)
        run: |
          make asan
          make lsan
      - name: TSan (SPSC/pipeline)
        run: make tsan
