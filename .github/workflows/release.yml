name: Release

# 打 tag vX.Y-ce 触发：构建 Release APK 并发布 GitHub Release
on:
  push:
    tags:
      - 'v*-ce'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set up pnpm (web-ui 前端构建依赖)
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: android/web-ui/pnpm-lock.yaml
      - name: Install web-ui dependencies
        working-directory: android/web-ui
        run: pnpm install --frozen-lockfile
      - name: Prepare keystore (RIKKA_CE secrets → local.properties)
        env:
          RIKKA_CE_KEYSTORE_B64: ${{ secrets.RIKKA_CE_KEYSTORE_B64 }}
          RIKKA_CE_KEYSTORE_PASS: ${{ secrets.RIKKA_CE_KEYSTORE_PASS }}
          RIKKA_CE_KEY_ALIAS: ${{ secrets.RIKKA_CE_KEY_ALIAS }}
          RIKKA_CE_KEY_PASS: ${{ secrets.RIKKA_CE_KEY_PASS }}
        run: |
          echo "$RIKKA_CE_KEYSTORE_B64" | base64 -d > /tmp/rikkahub-ce.keystore
          {
            echo "storeFile=/tmp/rikkahub-ce.keystore"
            echo "storePassword=$RIKKA_CE_KEYSTORE_PASS"
            echo "keyAlias=$RIKKA_CE_KEY_ALIAS"
            echo "keyPassword=$RIKKA_CE_KEY_PASS"
          } > android/local.properties
          cat android/local.properties | sed 's/=.*/=<hidden>/'
      - name: Build release APK (signed)
        run: |
          cd android && ./gradlew :app:assembleRelease --no-daemon > /tmp/gradle.log 2>&1 || { echo "GRADLE FAILED"; tail -100 /tmp/gradle.log; exit 1; }
          ls -la app/build/outputs/apk/release/
      - name: Verify signature
        run: |
          cd android
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
      - name: Rename APK
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd android
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/rikkahub-ce-${VER}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/rikkahub-ce-*.apk
          generate_release_notes: true
