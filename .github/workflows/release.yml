name: Release

# 打 tag vX.Y-ce 触发：构建 Release APK 并发布 GitHub Release
on:
  push:
    tags:
      - 'v*-ce'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build release APK
        run: |
          gradle -p android :app:assembleRelease --no-daemon > /tmp/gradle.log 2>&1 || { echo "GRADLE FAILED"; tail -80 /tmp/gradle.log; exit 1; }
          ls -la android/app/build/outputs/apk/release/
      - name: Rename APK
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/rikkahub-ce-${VER}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/rikkahub-ce-*.apk
          generate_release_notes: true
